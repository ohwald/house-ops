name: CI

# 唯一的合并门禁：所有结果汇总到 ci-gate（分支保护只要求 ci-gate 这一项）。
# 增删检查只改 ci-gate 的 needs，不用动 GitHub 上的分支保护配置。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies (dashboard only; core scripts are zero-dependency)
        run: npm ci

      - name: Syntax check — every module must parse
        run: find scripts scrapers tools -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Environment self-check (doctor)
        run: node scripts/doctor.mjs

      - name: Golden tests (selftest)
        run: node scripts/selftest.mjs

      - name: CLI smoke — stats / official-source lookup (offline, no network)
        run: |
          node scripts/stats.mjs
          node scripts/scan.mjs official --market cn
          node scripts/scan.mjs official --market eu
          node scripts/scan.mjs official --market apac

      - name: Map page smoke test
        run: |
          node scripts/map.mjs --out /tmp/map.html
          grep -q 'house-ops 房源地图' /tmp/map.html
          grep -q 'const INITIAL_DATA' /tmp/map.html
          echo 'Map page generated OK'

      # ink's dependency chain (string-width) uses the RegExp v flag — Node 18 can't even parse it,
      # so the TUI is Node ≥20 only while every other script stays Node ≥18.
      - name: Dashboard smoke — render one frame and exit
        if: matrix.node != 18
        run: |
          timeout 60s node scripts/dashboard.mjs < /dev/null > /tmp/dashboard.txt
          grep -q 'house-ops' /tmp/dashboard.txt
          echo 'Dashboard rendered OK'

      - name: Dashboard smoke — must refuse clearly on Node 18
        if: matrix.node == 18
        run: |
          set +e
          timeout 60s node scripts/dashboard.mjs < /dev/null > /tmp/dashboard.txt 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -q 'Node' /tmp/dashboard.txt
          echo "Dashboard refused on Node 18 with a readable message (exit $code)"

      - name: Report numbers are atomic under concurrency
        run: |
          : > /tmp/nums
          for i in 1 2 3 4 5; do (node scripts/reserve-report-num.mjs >> /tmp/nums) & done
          wait
          echo "allocated: $(sort /tmp/nums | tr '\n' ' ')"
          test "$(wc -l < /tmp/nums)" -eq 5
          test -z "$(sort /tmp/nums | uniq -d)"
          echo 'No duplicate report numbers'

  privacy-guard:
    name: Privacy guard — no user data in tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if user-layer data is tracked
        run: |
          PATTERN='^(data/(scans|evidence|notes|policy)/|data/watchlist\.md$|data/geo-cache\.json$|data/map\.html$|data/[0-9]{3}-|^reports/[0-9]{3}-|^config/profile\.yml$|^modes/_profile\.md$|^modes/_custom\.md$|^modes/_brief\.md$|\.DS_Store$)'
          if git ls-files | grep -E "$PATTERN"; then
            echo '::error::User-layer files are tracked by git. Per the AGENTS.md Data Contract these must never be committed. Remove them with `git rm --cached <file>` and extend .gitignore.'
            exit 1
          fi
          echo 'OK — no user-layer data tracked.'

  package-gate:
    name: Package gate — the shipped skill copy must be self-contained
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the distributable skill folder
        run: node tools/package-skill.mjs .workbuddy/tmp/clawhub/house-ops

      - name: The copy must pass doctor + selftest with no repo around it
        working-directory: .workbuddy/tmp/clawhub/house-ops
        run: |
          node scripts/doctor.mjs
          node scripts/selftest.mjs

      - name: The copy must carry no user data
        working-directory: .workbuddy/tmp/clawhub/house-ops
        run: |
          diff -q config/profile.yml "$GITHUB_WORKSPACE/config/profile.example.yml"
          for f in _profile.md _custom.md _brief.md; do
            if [ -e "modes/$f" ]; then
              echo "::error::modes/$f (user layer) leaked into the package"
              exit 1
            fi
          done
          for d in data reports; do
            test -f "$d/.gitkeep"
            extra=$(find "$d" -mindepth 1 ! -name '.gitkeep')
            if [ -n "$extra" ]; then
              echo "::error::$d/ carries user data: $extra"
              exit 1
            fi
          done
          echo 'OK — package is clean and self-contained'

  ci-gate:
    name: ci-gate
    needs: [verify, privacy-guard, package-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every upstream job to pass
        run: |
          failed=0
          for r in "${{ needs.verify.result }}" "${{ needs.privacy-guard.result }}" "${{ needs.package-gate.result }}"; do
            if [ "$r" != "success" ]; then
              echo "::error::upstream job result: $r"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo '::error::ci-gate failed — merging is blocked until every check above is green.'
            exit 1
          fi
          echo 'All required checks passed — merge allowed.'
