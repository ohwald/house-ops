# contract-checklist.cn.yml — 中国二手房/新房交易文件条款走查清单
#
# 用法：contract 模式逐条对照用户提供的认购书/买卖合同/补充协议/中介协议。
# 每条输出：条款状态（✅ 合规 / ⚠️ 有风险 / ⛔ 红旗 / 缺失）+ 风险说明 + 修改建议。
# 民法典口径为框架依据（定金、格式条款、违约责任），具体执行以当地司法实践为准。
# 本表不构成法律意见。

- clause: 定金 vs 订金
  check: "文件写的是'定金'（适用定金罚则，不退/双倍）还是'订金/意向金'（可退）？金额是否 ≤ 主合同标的额 20%？"
  red_flag: "定金 > 20%；或'无论何种原因不退'的无差别没收条款"

- clause: 认购书转签时限
  check: "认购书约定几日内转签正式买卖合同？逾期未签的定金处理？"
  red_flag: "转签时限过短（<7 天）且未成交即没收定金"

- clause: 解押与过户时限
  check: "卖方有抵押时的解押期限、双方过户时限是否明确到日？逾期的违约责任（日万分之几）？"
  red_flag: "无时限、'另行协商'、或逾期违约金畸低（无约束力）"

- clause: 贷款不批的责任划分
  check: "因买方征信/银行政策原因贷款不足时，是补现金、解除合同还是没收定金？"
  red_flag: "贷款不批一律视为买方违约没收定金（应争取'无责解除'条款）"

- clause: 户口迁出
  check: "卖方户口迁出时限与逾期违约金（按日计）是否写入？户口无法强制迁出，唯一约束是违约金。"
  red_flag: "未约定迁出时限，或只作口头承诺"

- clause: 学位/落户承诺
  check: "学位占用、对口学校、落户资格等承诺是否写入合同（或补充协议）？口头承诺无约束力。"
  red_flag: "中介/房东口头承诺学区但拒绝落纸"

- clause: 税费承担
  check: "各项税费（契税/增值税/个税/中介费）由谁承担是否逐项写明？'到手价'意味着全部转嫁买方。"
  red_flag: "'到手价'未附税费测算明细"

- clause: 面积差异处理
  check: "实测面积与约定面积差异的处理（±3% 据实结算、超 3% 买方可解约退款）是否符合民法典口径？"
  red_flag: "约定'面积误差不退不补'"

- clause: 交房标准与物业交割
  check: "交房时间、逾期交房违约金、家具家电留存清单（品牌型号写附件并拍照）、物业/水电/燃气/供暖欠费结清责任。"
  red_flag: "'现状交付'无清单附件"

- clause: 房屋质量与隐瞒责任
  check: "是否约定卖方对隐瞒重大瑕疵（渗漏、凶宅、非正常死亡、承重改动）的赔偿责任与解约权？"
  red_flag: "'买方已充分知晓房屋状况'的一揽子免责表述"

- clause: 不可抗力与政策变动
  check: "限购/贷款政策变动导致交易不能时的处理（互不追责解约 vs 定金罚则）？"
  red_flag: "政策变动风险全部归买方"

- clause: 格式条款与空白条款
  check: "手写条款与格式条款冲突时以谁为准？空白处是否全部划除？附件是否与正文同等效力？"
  red_flag: "'以本补充协议为准'单方覆盖主合同买方权利；空白条款未划除"

- clause: 中介服务协议（单独审）
  check: "佣金比例、支付节点（建议过户后付大头）、'跳单'条款范围（是否过宽至亲戚朋友）、未成交是否退费、承诺的服务内容清单。"
  red_flag: "签约即收全佣；跳单条款覆盖'任何渠道'任何亲属；霸王免责条款"
