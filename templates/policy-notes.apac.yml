# policy-notes.apac.yml — 亚太首批三个市场的购房政策数据表（中国香港 · 新加坡 · 日本）
#
# 纪律与 policy-notes.cn.yml / eu.yml 完全一致：
#   - 每行携带 as_of；**写入报告前必须联网核实并以核实结果为准**，报告中标注核实日期。
#   - 来源冲突时用 `conflict: true` 显式标注，并在评估里显式告知用户“该口径存在冲突，需就地核实”。
#   - 本表不提供任何法律或税务意见；跨境购房务必找当地律师/税务顾问（香港律师、新加坡律师、
#     日本司法书士与宅建士各司其职）。
#
# 与中国大陆、欧洲相比，亚太这三个市场的结构性差异：
#   1. **退出机制的差别最大**：香港签临时买卖合约即绑定（无冷静期）；新加坡 OTP 阶段的定金即具约束力；
#      日本没有法定冷静期，但有「手付解除」与「融资特约」两个必须写进合约的退出阀门。
#      把欧洲的“随时可以反悔”套到这里会直接亏掉定金。
#   2. **持有成本与年期风险比中国大陆更隐蔽**：香港的土地契约年期与大厦大维修分摊、
#      新加坡的地契剩余年期与组屋 MOP、日本的管理费+修繕積立金不足与耐震基准。
#   3. **外国人门槛的形态不同**：日本基本无限制但有申报义务；新加坡是税务型门槛（ABSD 60% 且须现金）；
#      中国香港自 2024-02-28 撤辣后已无限购型印花税，剩下的是按揭与资金来源审查。

as_of_overview: 2026-09-24
verification_rule: "每次引用前联网核实并以核实结果为准；报告标注核实日期"
conflict_rule: "凡标 conflict: true 的口径，公开来源互相打架——报告必须显式提示并给出待核实清单"

markets:
  # ========================= 中国香港特别行政区（Hong Kong, China） =========================
  hk:
    name: 中国香港特别行政区（Hong Kong, China）
    currency: HKD
    units:
      area_unit: sqft
      price_scale: wan
      note: 挂牌与成交惯用「万港元」与「平方呎（实用面积）」；报告须注明是实用面积还是建筑面积。
    transaction_tax:
      name: 从价印花税（Ad Valorem Stamp Duty, AVD）第 1 标准第 1 部／第 2 标准
      as_of: 2026-02-26
      basis: 按成交价与市值两者中较高者计算
      bands:
        - ["HK$4,000,000 或以内", "HK$100"]
        - ["HK$4,000,001 - 4,323,780", "HK$100 + 超出 400 万部分的 20%"]
        - ["HK$4,323,781 - 4,500,000", "1.50%"]
        - ["HK$4,500,001 - 4,935,480", "HK$67,500 + 超出 450 万部分的 10%"]
        - ["HK$4,935,481 - 6,000,000", "2.25%"]
        - ["HK$6,000,001 - 6,642,860", "HK$135,000 + 超出 600 万部分的 10%"]
        - ["HK$6,642,861 - 9,000,000", "3.00%"]
        - ["HK$9,000,001 - 10,080,000", "HK$270,000 + 超出 900 万部分的 10%"]
        - ["HK$10,080,001 - 20,000,000", "3.75%"]
        - ["HK$20,000,001 - 21,739,120", "HK$750,000 + 超出 2000 万部分的 10%"]
        - ["HK$21,739,121 - 100,000,000", "4.25%"]
        - ["HK$100,000,001 - 109,574,470", "HK$4,250,000 + 超出 1 亿部分的 30%"]
        - ["HK$109,574,471 或以上", "6.5%"]
      abolished:
        as_of: 2024-02-28
        items:
          - 额外印花税 SSD（现税率 0%）
          - 买家印花税 BSD（现税率 0%，原针对非香港永久性居民）
          - 新从价印花税 NRSD（现税率 0%）
        note: 撤辣后住宅买卖一般只涉 AVD，**首置与否同税**；非永久居民不再因身份多缴印花税。
      deadline: 文书签立后 30 天内加盖印花（实务由律师代办）
      verify: true
    financing:
      ltv:
        self_occupied_up_to_30m: 70%
        self_occupied_above_30m: 60%
        non_self_occupied: 50%
        as_of: 2026-02-28
      dsr: "统一上限 50%（2024-10-16 起，自用/出租/首置/非首置/住宅/非住宅同一口径）"
      stress_test: "自 2024-02-28 起暂停（原为假设利率上升 2 厘后供款不超过入息 60%）"
      valuation_gap: "**银行按估价与成交价孰低计算贷款额**——估价不足会直接吃掉成数，出价前先估。"
      mortgage_insurance:
        note: 经按证保险公司（HKMCI）按揭保险计划可超过基本成数上限，需付保费且要求自住与首置等条件。
        conflict: true
        conflict_note: 分档口径各资料不一（有称 800 万以下可九成、800-1000 万八成；也有称 1000 万以下可九成），
          一律以按证保险公司当期公布为准。
      non_local_income: 非本地收入人士银行可自行收紧成数；自雇人士通常低于受薪上限。
      verify: true
    recurring_costs:
      rates: 差饷按应课差饷租值 5% 分季缴付
      government_rent: 政府地租按应课差饷租值 3%（新界及新九龙等适用契约）
      management_fee: 管理费 + 大厦维修基金；大维修（强制验楼/验窗）可产生大额一次性分摊
      property_tax_on_rental: 出租物业税为净应评税值 15%，即（租金收入 − 已缴差饷）× 80% × 15%
      verify: true
    tenure:
      forms: [政府租契（leasehold）下的业权, 不分割份数（undivided share）]
      land_lease_expiry:
        note: 多数新界土地契约年期至 2047-06-30；港岛/九龙部分为 75 年可续期或 999 年。年期届满的续期安排
          政府尚未公布完整机制，长期持有须把年期风险计入。
        verify: true
    process:
      steps:
        - 落订前先做土地注册处查册（业权/按揭/押记/命令）
        - 签临时买卖合约并付定金（常见 5%），**签署即具法律约束力**
        - 委任律师，处理业权质询（踢契）与查册
        - 签正式买卖合约（实务常在临时合约后 5 个工作天内）并加付订金（大订，常见至 10%）
        - 成交（常见 4-8 周）并完成登记与加盖印花
      no_cooling_off: "**中国香港无法定冷静期**；违约即没收定金（常见 5%，已加付大订则为 10%，以合约条款为准）"
      verify: true
    key_checks:
      - 查册：业权、按揭/押记、法庭命令、钉契与不分割份数是否清晰
      - 实用面积与楼龄以物业资讯网（PIO）与屋宇署记录核对，勿信中介数字
      - 僭建、维修令与清拆令（屋宇署）
      - 管理费、维修基金结余与业主立案法团的大维修决议
      - 按揭估价不足的差额要自备现金
      - 一手盘：价单是叫价，只有成交纪录册才是成交；核对楼花期与关键日期
      - 凶宅无统一法定定义，只能靠查册、新闻与代理披露交叉核实，未证实前不得当作事实陈述

  # ================================= 新加坡（Singapore） =================================
  sg:
    name: 新加坡（Singapore）
    currency: SGD
    units:
      area_unit: sqft
      price_scale: whole
      note: 市场惯用「每平方呎单价（psf）」比较，总价按新元整额报价。
    transaction_tax:
      buyer_stamp_duty:
        name: Buyer's Stamp Duty（BSD，住宅）
        as_of: 2026-09-24
        bands:
          - ["首 S$180,000", "1%"]
          - ["S$180,001 - 360,000", "2%"]
          - ["S$360,001 - 1,000,000", "3%"]
          - ["S$1,000,001 - 1,500,000", "4%"]
          - ["S$1,500,001 - 3,000,000", "5%"]
          - ["S$3,000,000 以上", "6%"]
        basis: 按成交价或市值较高者
      absd:
        name: Additional Buyer's Stamp Duty（ABSD）
        as_of: 2023-04-27
        rates:
          - ["新加坡公民 第 1 套", "0%"]
          - ["新加坡公民 第 2 套", "20%"]
          - ["新加坡公民 第 3 套及以上", "30%"]
          - ["永久居民 第 1 套", "5%"]
          - ["永久居民 第 2 套", "30%"]
          - ["永久居民 第 3 套及以上", "35%"]
          - ["外国人（任何住宅）", "60%"]
          - ["公司/信托等实体", "65%"]
        fta_exemption: 美国、瑞士、挪威、冰岛、列支敦士登的国民（及部分永久居民）按自贸协定享公民待遇
        cash_only: "**ABSD 不能用公积金支付，必须现金**；外国买家须在成交前备足首付＋BSD＋ABSD"
        deadline: 签约或行使 OTP 后 14 天内（海外签署 30 天内）
        verify: true
      ssd:
        name: Seller's Stamp Duty（SSD，卖方负担但影响持有策略）
        conflict: true
        conflict_note: 2025-07-04 起购入者改为 4 年持有期、16/12/8/4%；此前购入者仍按 3 年 12/8/4%。
          部分资料仍只写 3 年制，报告须按购入日期区分并提示核实。
        post_2025_07_04: ["1 年内 16%", "1-2 年 12%", "2-3 年 8%", "3-4 年 4%", "满 4 年 0%"]
        pre_2025_07_04: ["1 年内 12%", "1-2 年 8%", "2-3 年 4%", "满 3 年 0%"]
        verify: true
    financing:
      ltv_bank: ["第 1 套 75%（首付 25%，其中至少 5% 现金）", "第 2 套 45%", "第 3 套及以上 35%"]
      ltv_reduction: 贷款年期超过 30 年或借款人满 65 岁未还清时，成数下调（常见降至 55%）
      hdb_loan_ltv:
        value: 75%
        as_of: 2024-08-20
        conflict: true
        conflict_note: 有资料仍写 80%，那是 2024-08-20 下调前的旧口径。
      tdsr: 55%（所有债务供款占收入上限，按 4% 利率下限压力测试）
      msr: 30%（仅组屋与直接从发展商购买的新 EC）
      hdb_income_ceiling: 家庭 S$14,000；单身（单身计划）S$7,000；扩展家庭另有较高顶限
      foreigner: 外国人可用银行贷款，首付比例由银行自定且普遍较高；不能使用公积金
      verify: true
    housing_types:
      hdb:
        who: 公民或永久居民家庭（外国人不能购买；永久居民家庭通常须满 3 年 PR 才能买转售组屋）
        mop: 5 年最低居住期（2024-10 起 Standard / Plus / Prime 分类下，Plus 与 Prime 为 10 年且带补贴回收与转售限制）
        verify: true
      ec: 执行共管公寓（EC）：收入顶限较高、5 年 MOP、满 10 年后私有化，外国人可买 MOP 后的 EC
      condo: 私宅公寓，外国人可买（受 ABSD 60% 约束）
      landed: 有地住宅属受限制住宅，外国人购买须向 SLA 申请批准
      tenure: 地契分 99 年、999 年与永久（freehold），以业权文件为准
    recurring_costs:
      property_tax_owner_occupied:
        bands: ["首 S$12,000 年值 0%", "其后 S$28,000 4%", "其后 S$10,000 6%", "其后 S$25,000 10%", "其后 S$10,000 14%", "其后 S$15,000 20%", "其后 S$40,000 26%", "超过 S$140,000 32%"]
        note: 税基是年值（Annual Value，估算年租值），不是房价
        conflict: true
        conflict_note: 旧表仍流传「0–16%」的税率区间，那是 2022 年分阶段上调前的口径。
      property_tax_non_owner_occupied:
        bands: ["首 S$30,000 年值 12%", "其后 S$15,000 20%", "其后 S$15,000 28%", "超过 S$60,000 36%"]
        note: 出租或空置均按非自住税率，无免税门槛
      non_residential: 商业与工业物业按年值 10% 统一税率
      mcst: 公寓管理费与累积基金（sinking fund）；组屋为 S&CC
      rebate_2026: 2026 年一次性回扣（自住组屋 15%、自住私宅 10%，上限 S$500，以 IRAS 为准）
      verify: true
    process:
      steps:
        - 出价与 OTP（Option to Purchase）：付预订金（常见 1%）换取 14 天行使期
        - 行使 OTP 并付定金（常见合计 4-9%）；**OTP 阶段无冷静期，放弃即没收定金**
        - 律师产权查册与贷款安排；组屋另走 HDB 转售程序（申请、估值、贷款/公积金）
        - 签买卖协议（S&P）并完成（常见 8-12 周）
      note: 组屋与私宅程序不同，组屋还受种族与永久居民配额（EIP/SPR）规则约束。
      verify: true
    key_checks:
      - 地契年期与剩余年期（影响贷款年期、公积金使用与转售受众）
      - 组屋 MOP 与转售限制、配额规则、整套出租限制
      - ABSD 现金压力：外国人 60% 须现金，不能以公积金或贷款支付
      - MCST 财务、大修决议与集体出售（en bloc）进展；同意门槛以当期法规为准
      - URA 成交纪录的四个盲区：caveat 覆盖率、异常值剔除、新售非 caveat、三类成交不得混算
      - 出租用途下的非自住税率与租金所得税

  # =================================== 日本（Japan） ===================================
  jp:
    name: 日本（Japan）
    currency: JPY
    units:
      area_unit: sqm
      price_scale: wan
      note: 挂牌与成交惯用「万円」与「㎡」；土地与业界口语用「坪」（1 坪 ≈ 3.3058 ㎡），报告出现坪须标注换算。
    transaction_tax:
      acquisition_tax:
        name: 不动产取得税（都道府县税）
        standard: 4%
        reduced: 住宅与住宅用地 3%（特例延续至 2027-03-31）
        additional: 住宅用地另有课税标准减半措施；新建住宅另有 1,200 万日圆扣除（长期优良等可至 1,300 万）
        verify: true
      registration_tax:
        name: 登録免許税
        rates:
          - ["土地所有权移转", "2.0% → 轻减 1.5%（2026-04-01 至 2029-03-31）"]
          - ["住宅用建物所有权保存", "0.4% → 0.15%"]
          - ["住宅用建物所有权移转（中古）", "2.0% → 0.3%"]
          - ["抵押权设定", "0.4% → 0.1%"]
        conditions: 轻减通常要求自住、床面积门槛与取得后一年内登记，并附市区町村长证明书
        conflict: true
        conflict_note: 2026 年度税制改正把床面积门槛由 50㎡ 放宽至 40㎡、上限由 280㎡ 收紧至 240㎡——
          各资料对新旧门槛说法不一，以取得时点的政令为准。
        verify: true
      stamp_duty:
        name: 印紙税（不动产让渡契约书的轻减税率，至 2027-03-31 为止作成者）
        bands:
          - ["1,000 万超 5,000 万以下", "1 万日圆（本则 2 万）"]
          - ["5,000 万超 1 亿以下", "3 万日圆（本则 6 万）"]
        verify: true
      consumption_tax:
        land: 土地恒非课税
        building: 建物仅在卖方为课税事业者（开发商、转售的不动产公司）时课 10%；向个人购买则不课税
        note: 这是中古屋「卖方是个人还是公司」导致总成本差异达数个百分点的主要原因。
      brokerage_fee_cap: 仲介手数料上限（含税）：200 万以下 5.5%／200-400 万 4.4%／400 万超 3.3%；
        800 万以下的买卖另有 33 万上限特例
      other_costs: 司法书士报酬、火灾与地震保险、贷款事务手续费与保证费；总体预算约房价 5-9%
      verify: true
    recurring_costs:
      fixed_asset_tax: 固定資産税标准税率 1.4%（按固定資産税評価額，非成交价）
      city_planning_tax: 都市計画税最高 0.3%
      small_residential_land: 200㎡ 以下小规模住宅用地：固定資産税减为 1/6、都市計画税减为 1/3
      new_building_relief: 新建住宅建物部分减半（独栋 3 年、公寓 5 年），期限延长至 2031-03-31
      condo: 管理费 + 修繕積立金（公寓）；修繕積立金不足会以阶段性调涨或一次性征收补足
      non_resident: 非居住者须指定税务代理人（納税管理人）接收与缴纳税单
      verify: true
    financing:
      ltv:
        permanent_resident: 约 20% 首付
        non_permanent_resident: 30-50% 首付
        non_resident_abroad: LTV 常见 50-70%
      flat_35: 住宅金融支援机构的 Flat 35 要求永久居留权
      group_credit_life: 团信（团体信用生命保险）为多数房贷的前提，健康状况会直接影响核贷
      rate_env: 日本银行 2025-12-19 将政策利率由 0.50% 上调至 0.75%；浮动利率仍为主流
      verify: true
    foreign_buyer_rules:
      ownership: 日本未对外国人取得不动产设限（截至 2026-09 无禁止性法案）
      review_panel: 政府有检讨近防卫设施与国境离岛土地取得的检讨机制，结论与立法动向须实时核实
      reporting:
        - 非居住者取得后 20 天内须向日本银行提出事后报告（2026-04-01 起适用）
        - 2026 年度起登记申请时须申报国籍（法务省省令改正，具体生效日以公告为准）
      important_land_act:
        name: 重要土地等調査法（2022 年施行）
        rule: 特别注视区域内 200㎡ 以上的土地或建物所有权移转，须在签约前事前届出；内外无差别
        penalty: 未届出即签约可处 6 月以下惩役或 100 万日圆以下罚款
        check: 内閣府门户可确认物件是否在区域内；城市普通住宅绝大多数不在范围内
      withholding:
        seller_non_resident: 卖方为非居住者时，买方须扣缴 10.21%（买方为个人且自住、1 亿日圆以下者除外）
        rent_non_resident: 非居住者业主的租金会被扣缴 20.42%（可透过指定代理人避免）
      gats_note: 日本在 WTO/GATS 下对土地取得负内国民待遇义务，因此新规多采「内外无差别＋安全保障目的限定」形式
      verify: true
    tenure:
      forms: [所有权（含土地持分）, 借地権（含定期借地権）]
      rebuild_prohibition: 建筑基准法接道义务（原则 2m 以上）不满足者为「再建筑不可」——
        银行不融资、转售只能找现金买家，是日本低价物件最常见的低价原因
      seismic: 1981-05-31 前的旧耐震基准物件，融资与住宅贷款扣除均受影响，地震保费也无折扣
      zoning: 用途地域、容积率、建蔽率、防火地域等以都市计画情报为准
      boundaries: 越境、境界未定、私道负担与セットバック义务须逐项确认
    process:
      steps:
        - 买付申込（书面出价）
        - 重要事项説明：宅建士就法令限制、基础设施、灾害风险等作法定说明并交付书面
        - 签売買契約并付手付金（常见 5-10%）
        - 融资特约（ローン特約）期间内核贷；未通过可无责解除
        - 决済、司法书士办理所有权移转登记（常见签约后 1-2 个月）
      exit_mechanisms:
        handmoney_release: "**手付解除**：卖方着手履行前，买方放弃手付、卖方双倍返还即可解约（须在契约中写明）"
        loan_contingency: "**融资特约**：核贷未通过可无责解除，**没有写进契约就没有这条退路**"
        no_statutory_cooling_off: 日本投资性买卖无法定冷静期，不能套用欧洲的冷静期预期
      verify: true
    key_checks:
      - 重要事项説明书逐条核对（法令限制、基础设施、灾害、管理状态）
      - ハザードマップ：洪水、土砂、津波、液状化
      - 公寓：修繕積立金水位、长期修繕计划、管理组合总会决议与争议、管理费调涨史
      - 耐震基准与耐震诊断；旧耐震物件的融资限制
      - 再建筑不可（接道）、越境与境界、私道负担
      - 事故物件（心理瑕疵）依国土交通省指引判断，未确认前不得断言
      - 登记簿核对（所有者、抵押权、差押）与相続登记是否已办
      - 重要土地等調査法的区域确认（尤其买地与近设施/离岛物件）

common_market_guidance:
  listing_platforms_note: 亚太主流挂牌平台（香港的中原/美联/利嘉阁等、新加坡的 PropertyGuru/99.co/SRX、
    日本的 SUUMO/LIFULL HOME'S/athome 等）**尚未注册为本项目的 scrapers 平台模块**，
    目前只能走 generic 兜底清单采集；未经验证的选择器一律不许写。
  marketing_claim_patterns:
    - 香港「实用面积」与建筑面积混用；「上车盘/笋盘/业主急让」须以土地注册处成交代价核对
    - 香港一手盘的「价单」是叫价，只有成交纪录册是成交；示范单位与楼书不构成事实
    - 新加坡「psf 创新高」常混入新售/转售/转让三种不同管道，单价直接比较即为错
    - 日本「表面利回り」多为未扣管理费、税费与空置的毛回报，与实回报差距极大
    - 日本「リノベ済/即入居可」不等于耐震合格或再建筑可；低价物件的低价原因必须查出来
  evidence_hierarchy_note: 这三个市场共同的隐形成本高发区——香港的大维修分摊与土地契约年期、
    新加坡的 ABSD 现金压力与地契剩余年期、日本的修繕積立金不足与再建筑不可／旧耐震——
    都不是照片能看出来的，必须索取书面文件或官方登记核实。
