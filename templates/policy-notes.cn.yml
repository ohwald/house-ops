# policy-notes.cn.yml — 中国大陆购房政策数据表
#
# 用法：evaluate/deep-dive 涉及政策事实时查本表起步，但每行条目都会过时——
# **写入报告前必须联网核实并以核实结果为准**，报告中标注 as_of（核实日期）。
# 发现表内与最新口径冲突时：按核实结果评估，并提醒用户可更新本表。
#
# 每行必须携带 as_of（该口径的生效/核实时点）。本表整体 as_of: 2026-09-03 整理，
# 依据截至整理时的公开政策文件；不构成法律或税务意见。

as_of_overview: 2026-09-03
verification_rule: "每次引用前联网核实；报告标注核实日期"

deed_tax:  # 契税（家庭住房，90㎡以下与以上口径已统一为 140㎡ 档）
  as_of: 2024-12-01  # 财政部 税务总局 住建部公告 2024 年第 16 号
  rules:
    first_home:
      area_le_140sqm: "1%"
      area_gt_140sqm: "1.5%"
    second_home:
      area_le_140sqm: "1%"
      area_gt_140sqm: "2%"
  notes: "以家庭为单位（含未成年子女）；北上广深二套已适用同口径。个别城市/新房可能有补贴，需核实当地口径。"

vat:  # 增值税（住宅，卖方承担惯例上常转嫁买方，合同约定）
  as_of: 2024-12-01  # 取消普通/非普通住宅标准后全国统一
  rules:
    held_over_2yrs: "免征"
    held_le_2yrs: "5% 征收率全额（附加税另计）"
  notes: "年限自契税完税或产权登记孰早起算。"

individual_income_tax:  # 个税（住宅转让，卖方承担、常转嫁）
  as_of: 2024-12-01
  rules:
    full_five_years_and_only_home: "免征（满五唯一）"
    otherwise: "核定征收：总价 1%-2%（各地口径不同）；或差额 20%（能提供原值凭证时）"
  notes: "'唯一'以家庭在同城住房数认定。置换退税政策有窗口期限制，需核实。"

down_payment:  # 商贷首付比例下限
  as_of: 2024-05-17  # 央行 331/2024 政策后全国下限
  rules:
    first_home: "15%"
    second_home: "25%"
  notes: "各城市银行实际执行可上浮；部分城市分区分套型有差异，按当地银行口径核实。"

mortgage_rate:  # 商贷利率
  as_of: 2025-07-01
  rules:
    mechanism: "新发放利率由银行按 LPR 加减点自主定价，全国下限已取消；存量房贷利率有批量调整机制"
    typical_first_home: "整理时多数城市首套新发放利率约 3.0%-3.5%/年，城市间差异大"
  notes: "利率随时段波动大，报告中必须以核实当日口径为准并标注城市。"

housing_fund_loan:  # 公积金贷款利率
  as_of: 2025-05-01
  rules:
    first_home_5yr_plus: "2.6%"
    first_home_le_5yr: "2.1%"
    second_home_5yr_plus: "3.075%"
    second_home_le_5yr: "2.525%"
  notes: "额度上限城市差异大；'商转公''组合贷'规则城市各异，需核实当地公积金中心。"

purchase_restriction:  # 限购
  as_of: 2025-07-01
  rules:
    general: "2024 年以来多数城市已全面或大幅放开限购；一线城市核心区仍存部分限制（社保年限/套数）"
    action: "按目标城市当期口径核实：是否限购、套数认定、社保/户籍要求"
  notes: "画像 eligibility.purchase_qualification 为'待确认'时，评估报告必须把限购资格列入待核实清单首位。"

school_district:  # 学区口径
  as_of: 2025-07-01
  rules:
    general: "公办小学初中按户籍/居住地划片免试入学；多校划片、六年一学位（部分城市五年）等政策城市/区县各异"
    action: "只采信教育局官网当年度招生政策；开发商与中介的'学区承诺'一律不采信"
  notes: "评估中学校配套只影响 Location 的'现状'项；学位占用核实归入交易安全清单。"

commercial_apartment:  # 商办公寓（40/50 年产权）——画像排除商办时评估直接 DQ
  as_of: 2025-07-01
  rules:
    down_payment: "通常 ≥50%，且只能商贷（最长 10 年）"
    utilities: "商水商电（部分项目通燃气），物业费高"
    school_hukou: "无学区、一般不可落户"
    resale: "转手税费极高（增值税/土地增值税/个税差额计征），流通性差"
  notes: "以'类住宅'销售的公寓（loft/酒店式）多属此列；个别城市有'商改租'新政但不改变产权属性。"

auction_property:  # 法拍房
  as_of: 2025-07-01
  rules:
    restriction: "法拍房已普遍纳入限购城市限购范围（需具备购房资格）"
    risks: ["占用与腾退（含长期租约）", "欠费（物业/水电/税费）", "原房东户口难迁", "税费承担按裁定，可能全部买方担", "无法贷款或贷款时效紧张"]
  notes: "务必尽调：裁定书、产调、实地看样；建议引入法辅或律师。评估默认 Risk ≥ 注意。"

shared_ownership:  # 共有产权房 / 保障性住房
  as_of: 2025-07-01
  rules:
    eligibility: "需符合当地申购资格（户籍/社保/无房等）"
    resale: "再交易受限：政府份额回购/转让对象受限/持有年限要求（城市差异大）"
  notes: "评估必须核对当地管理办法原文；按实际产权份额折算'单价'再对比市场。"

relocation_housing:  # 回迁安置房
  as_of: 2025-07-01
  rules:
    tradable: "部分回迁房有上市限制或未办大产证；办证前交易风险极高"
    management: "回迁与商品房常分区不分治，物业水平与软素质信号需实地观察"
  notes: "核对本套的产权证性质与土地性质（出让/划拨）；划拨土地转让可能补缴土地出让金。"

transfer_with_mortgage:  # 带押过户
  as_of: 2025-07-01
  rules:
    general: "多城市已推行'带押过户'：卖方无需先解押即可过户，缩短交易周期、降低过桥资金"
  notes: "城市与银行受理条件各异；合同中仍应约定解押/过户时限与违约责任作为兜底。"

trade_in_subsidy:  # 以旧换新 / 换房补贴
  as_of: 2025-07-01
  rules:
    general: "多地推行'卖旧买新'退税、国企收旧、开发商旧房换新购补贴等"
  notes: "属阶段性政策，报告引用时必须核实当期有效期与适用条件。"

property_tax_pilot:  # 房产税
  as_of: 2025-07-01
  rules:
    pilot: "上海/重庆试点运行中（对增量及高端存量征收，口径见当地）；全国扩围尚未落地"
  notes: "持有税预期影响长持成本判断，但不得作为确定性风险计入评分，只能提示。"

transaction_flow:  # 二手房交易流程要点
  as_of: 2025-07-01
  steps: ["定金/意向", "签买卖合同(网签)", "资金监管", "解押(如有)", "缴税过户", "放款", "交房"]
  notes: "定金具法律效力（上限为合同额 20%）；大额资金务必走资金监管；全流程各城市节点略有差异。"

transaction_safety_checklist:  # 交易安全核验（AI 无法远程核实，输出为用户清单）
  - 不动产权证与产权人身份核对；共有权人书面同意
  - 产调（登记簿查询）：抵押、查封、异议登记
  - 户口占用与迁出约定写入合同
  - 租约占用（买卖不破租赁）与租金/押金交接
  - 物业/水电/燃气/供暖欠费结清
  - 学位占用（如适用）
  - 房屋结构改造合规性（拆改承重）
